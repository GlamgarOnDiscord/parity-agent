name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.1
      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: bun run typecheck
      - run: bun test
  proof:
    # The example invoice app is proved against the Virtual Salesman 3 reference on every change.
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: ./
        with:
          proof: examples/invoice/parity.proof.json
          url: http://127.0.0.1:4173/
          start: bun scripts/serve-static.ts examples/invoice --port 4173
  offline:
    # Replay, diff and report with the network cut: a network namespace with loopback only.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.1
      - run: bun install --frozen-lockfile
      - name: Prove and report with no network
        run: sudo unshare --net -- bash scripts/ci-offline.sh "$(command -v bun)" "$(id -un)"
