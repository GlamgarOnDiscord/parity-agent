name: Parity proof
description: Replay a Parity proof on a running web app and fail when any field differs. Plain code, no model call.
branding:
  icon: check-square
  color: blue
inputs:
  proof:
    description: Path of the proof JSON, relative to the repository root
    required: true
  url:
    description: URL of the app under test, for example http://127.0.0.1:4173/
    required: true
  start:
    description: Command that starts the app in the background before the proof runs (optional)
    required: false
    default: ""
  comment:
    description: Comment the verdict on the pull request (true or false)
    required: false
    default: "true"
outputs:
  verdict:
    description: "parity or differences"
    value: ${{ steps.prove.outputs.verdict }}
runs:
  using: composite
  steps:
    - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      with:
        bun-version: 1.3.1
    - name: Install Parity
      shell: bash
      working-directory: ${{ github.action_path }}
      run: bun install --frozen-lockfile
    - name: Start the app
      if: inputs.start != ''
      shell: bash
      env:
        START: ${{ inputs.start }}
      run: nohup bash -c "$START" > "$RUNNER_TEMP/parity-app.log" 2>&1 &
    - name: Wait for the app
      shell: bash
      env:
        URL: ${{ inputs.url }}
      run: |
        for i in $(seq 1 60); do
          curl -fsS -o /dev/null "$URL" && exit 0
          sleep 1
        done
        echo "The app did not answer at $URL within 60 s." >&2
        cat "$RUNNER_TEMP/parity-app.log" >&2 || true
        exit 1
    - name: Prove
      id: prove
      shell: bash
      env:
        PROOF: ${{ inputs.proof }}
        URL: ${{ inputs.url }}
        PARITY_DIR: ${{ runner.temp }}/parity
      run: |
        set +e
        mkdir -p "$PARITY_DIR"
        bun "$GITHUB_ACTION_PATH/bin/parity.ts" report --proof "$GITHUB_WORKSPACE/$PROOF" --url "$URL" \
          --out "$PARITY_DIR/report.html" --summary "$PARITY_DIR/summary.md"
        code=$?
        if [ -f "$PARITY_DIR/summary.md" ]; then cat "$PARITY_DIR/summary.md" >> "$GITHUB_STEP_SUMMARY"; fi
        if [ "$code" = 0 ]; then echo "verdict=parity" >> "$GITHUB_OUTPUT"; else echo "verdict=differences" >> "$GITHUB_OUTPUT"; fi
        echo "code=$code" >> "$GITHUB_OUTPUT"
    - name: Keep the report
      if: always()
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
      with:
        name: parity-report
        path: ${{ runner.temp }}/parity/report.html
        if-no-files-found: ignore
    - name: Comment the verdict
      if: always() && inputs.comment == 'true' && github.event_name == 'pull_request'
      shell: bash
      continue-on-error: true
      env:
        GH_TOKEN: ${{ github.token }}
        PR: ${{ github.event.pull_request.number }}
        SUMMARY: ${{ runner.temp }}/parity/summary.md
      run: |
        [ -f "$SUMMARY" ] || exit 0
        printf '\n<sub>Report: download the parity-report artifact of this run.</sub>\n' >> "$SUMMARY"
        gh pr comment "$PR" --repo "$GITHUB_REPOSITORY" --edit-last --body-file "$SUMMARY" \
          || gh pr comment "$PR" --repo "$GITHUB_REPOSITORY" --body-file "$SUMMARY"
    - name: Fail on a difference
      if: steps.prove.outputs.code != '0'
      shell: bash
      run: exit 1
